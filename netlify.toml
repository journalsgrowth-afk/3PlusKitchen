[build]
  publish = "."

# Nota: la home page es index.html (antes era Biblioteca3plus_Hub.html servido
# vía rewrite a "/"). Netlify sirve index.html en la raíz automáticamente,
# sin necesitar ninguna regla — esto elimina el riesgo de conflicto entre
# el rewrite y la regla de canonicalización que existía antes.

[[redirects]]
  from = "/Biblioteca3plus_Hub.html"
  to = "/"
  status = 301

[[redirects]]
  from = "/biblioteca3plus_hub"
  to = "/"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Cache-Control = "public, max-age=3600"

# ============================================================
# URLs oficiales — usan el título real del producto, no "landing"
# ni el nombre técnico del archivo. Estas son las que se comparten
# y las que usan el Hub/panel.
# (Los redirects a /vol1, /vol2, /vol3, /ob01-03, /ob-a, /ob-b se quitaron:
# esos archivos ya no viven en este sitio, se movieron a
# ARCHIVOS_FINALES_CLIENTE_no_subir_a_github/ para no exponer contenido
# pagado públicamente. Entrega real vía Hotmart.)
# ============================================================

[[redirects]]
  from = "/tu-estrategia-de-cocina-semanal"
  to = "/tu-estrategia-de-cocina-semanal.html"
  status = 200

[[redirects]]
  from = "/tu-cena-gana"
  to = "/tu-cena-gana.html"
  status = 200

[[redirects]]
  from = "/tu-toque-de-chef"
  to = "/tu-toque-de-chef.html"
  status = 200

[[redirects]]
  from = "/coleccion-completa"
  to = "/coleccion-completa.html"
  status = 200

# Canonicaliza el .html de cada uno de vuelta a la URL limpia sin extensión.
[[redirects]]
  from = "/tu-estrategia-de-cocina-semanal.html"
  to = "/tu-estrategia-de-cocina-semanal"
  status = 301

[[redirects]]
  from = "/tu-cena-gana.html"
  to = "/tu-cena-gana"
  status = 301

[[redirects]]
