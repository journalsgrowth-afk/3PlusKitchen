[build]
  publish = "."

[[redirects]]
  from = "/"
  to = "/Biblioteca3plus_Hub.html"
  status = 200

# Canonicaliza: si alguien visita el archivo del Hub directo (con o sin
# mayúsculas/extensión), lo mandamos de vuelta a la raíz — evita contenido
# duplicado y deja una sola URL real como "home page".
[[redirects]]
  from = "/Biblioteca3plus_Hub.html"
  to = "/"
  status = 301

[[redirects]]
  from = "/biblioteca3plus_hub"
  to = "/"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Cache-Control = "public, max-age=3600"

# Rutas amigables — cada producto accesible sin extensión .html
