<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lista de Compras Interactiva &mdash; 3+ Kitchen</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Anton&family=Fraunces:ital,wght@1,500&family=Hanken+Grotesk:wght@400;600;700;800&display=swap');
  :root{--carbon:#1C1C1C;--mostaza:#D4A017;--hueso:#F5F0E8;--vino:#7B1A2E;--hueso-dim:#EAE2D2;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--hueso);color:var(--carbon);font-family:'Hanken Grotesk',sans-serif;line-height:1.5;}
  header{background:var(--carbon);padding:28px 22px;text-align:center;}
  header img{height:34px;margin-bottom:12px;}
  header h1{font-family:'Anton',sans-serif;text-transform:uppercase;color:var(--hueso);font-size:22px;margin:0 0 6px;}
  header p{color:#c9c2b3;font-size:13px;margin:0;max-width:420px;margin:0 auto;}
  .wrap{max-width:520px;margin:0 auto;padding:20px 18px 60px;}
  .tabs{display:flex;gap:8px;margin-bottom:18px;}
  .tab{flex:1;text-align:center;padding:10px 6px;border-radius:8px;background:var(--hueso-dim);
    font-weight:800;font-size:12px;cursor:pointer;border:2px solid transparent;}
  .tab.active{background:var(--carbon);color:var(--hueso);}
  .recipe-list{display:flex;flex-direction:column;gap:8px;margin-bottom:24px;}
  .recipe-row{display:flex;align-items:center;gap:10px;background:#fff;border-radius:8px;padding:10px 12px;
    border:1px solid #ddd3bf;cursor:pointer;}
  .recipe-row.checked{background:var(--hueso-dim);border-color:var(--mostaza);}
  .recipe-row input{width:18px;height:18px;accent-color:var(--mostaza);flex-shrink:0;}
  .recipe-row .rt{font-weight:700;font-size:13.5px;flex:1;}
  .recipe-row .ri{font-size:11px;color:#8a8070;}
  .actions{display:flex;gap:10px;margin-bottom:18px;}
  button.gen{flex:1;background:var(--mostaza);color:var(--carbon);font-weight:800;font-size:14px;
    padding:14px;border:none;border-radius:8px;cursor:pointer;}
  button.clear{background:transparent;color:#8a8070;font-weight:700;font-size:12px;border:1px solid #ddd3bf;
    border-radius:8px;padding:14px 16px;cursor:pointer;}
  .list-section{display:none;}
  .list-section.show{display:block;}
  .list-title{font-family:'Anton',sans-serif;text-transform:uppercase;font-size:18px;margin:24px 0 10px;
    border-bottom:2px solid var(--mostaza);padding-bottom:8px;}
  .ing-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #ecE5d5;}
  .ing-row input{width:18px;height:18px;accent-color:var(--vino);flex-shrink:0;}
  .ing-row label{font-size:14px;flex:1;}
  .ing-row.bought label{text-decoration:line-through;color:#aaa;}
  .ing-count{font-size:11px;color:#8a8070;background:var(--hueso-dim);border-radius:10px;padding:2px 8px;}
  .empty{text-align:center;color:#8a8070;font-size:13px;padding:30px 0;font-style:italic;}
  footer{background:var(--carbon);padding:24px;text-align:center;}
  footer img{height:20px;margin:0 auto 8px;}
  footer p{color:#6b6355;font-size:11px;margin:0;}
</style>
</head>

const VOLS = Object.keys(DATA);
let currentVol = VOLS[0];
let selected = {};
let bought = {};

function renderTabs() {
  const tabsEl = document.getElementById('tabs');
  tabsEl.innerHTML = VOLS.map(v => '<div class="tab ' + (v===currentVol?'active':'') + '" onclick="switchVol(\'' + v + '\')">' + v + '</div>').join('');
}
function switchVol(v) {
  currentVol = v;
  renderTabs();
  renderRecipes();
}
function escKey(k){ return k.replace(/'/g, "\\'"); }
function renderRecipes() {
  const listEl = document.getElementById('recipeList');
  const recipes = DATA[currentVol];
  listEl.innerHTML = recipes.map(function(r){
    const key = currentVol + '|' + r.title;
    const ek = escKey(key);
    const checked = selected[key] ? 'checked' : '';
    const rowClass = selected[key] ? 'checked' : '';
    return '<div class="recipe-row ' + rowClass + '" onclick="toggleRecipe(\'' + ek + '\')">' +
      '<input type="checkbox" ' + checked + ' onclick="event.stopPropagation();toggleRecipe(\'' + ek + '\')">' +
      '<div><div class="rt">' + r.title + '</div><div class="ri">' + r.ingredients.join(' &middot; ') + '</div></div></div>';
  }).join('');
}
function toggleRecipe(key) {
  selected[key] = !selected[key];
  renderRecipes();
}
function clearAll() {
  selected = {};
  bought = {};
  renderRecipes();
  document.getElementById('listSection').classList.remove('show');
}
function generateList() {
  const ingMap = {};
  for (const key in selected) {
    if (!selected[key]) continue;
    const parts = key.split('|');
    const vol = parts[0], title = parts[1];
    const recipe = DATA[vol].find(function(r){ return r.title === title; });
    if (!recipe) continue;
    recipe.ingredients.forEach(function(ing){
      const norm = ing.trim();
      ingMap[norm] = (ingMap[norm] || 0) + 1;
    });
  }
  const ingredients = Object.keys(ingMap).sort();
  const listEl = document.getElementById('ingredientList');
  const section = document.getElementById('listSection');
  if (ingredients.length === 0) {
    listEl.innerHTML = '<div class="empty">Selecciona al menos una receta arriba.</div>';
  } else {
    listEl.innerHTML = ingredients.map(function(ing){
      const count = ingMap[ing];
      const boughtClass = bought[ing] ? 'bought' : '';
      const countBadge = count > 1 ? ('<span class="ing-count">&times;' + count + ' recetas</span>') : '';
      const eing = ing.replace(/'/g, "\\'");
      return '<div class="ing-row ' + boughtClass + '">' +
        '<input type="checkbox" ' + (bought[ing]?'checked':'') + ' onchange="toggleBought(\'' + eing + '\')">' +
        '<label>' + ing + '</label>' + countBadge + '</div>';
    }).join('');
  }
  section.classList.add('show');
  section.scrollIntoView({behavior:'smooth'});
}
function toggleBought(ing) {
  bought[ing] = !bought[ing];
  generateList();
}
renderTabs();
renderRecipes();

</script>
